<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="site-shell">
  <main class="container blog-layout">
    <header class="blog-header">
      <a class="site-home-link" href="/">← Voltar para a home</a>
      <div>
        <p class="blog-eyebrow">Blog</p>
        <h1 class="blog-title">{{ page.title }}</h1>
        {% if page.description %}
        <p class="blog-description">{{ page.description }}</p>
        {% endif %}
      </div>
    </header>
    {{ content }}
  </main>
</body>
</html>
