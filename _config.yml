title: Sávio Santos
description: Blog e portfólio de Sávio Santos
lang: pt-BR
markdown: kramdown
permalink: /:categories/:title/

theme: minimal-mistakes-jekyll

minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

author:
  name: "Sávio Santos"
  avatar: "/images/logo.jpeg"
  bio: "Engenheiro de Software, Mestre em Engenharia da Computação, com experiência em frontend, mobile e backend. Atualmente atuando em P&D com Inteligência Artificial, focado em visão computacional e modelos de linguagem."
  location: "Brasil"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:savi8sant8s@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/savi8sant8s"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/savi8sant8s"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-4707-6948"
    - label: "Prancheta Apps"
      icon: "fab fa-fw fa-google-play"
      url: "https://play.google.com/store/apps/dev?id=7964185345858453468"
    - label: "Lattes"
      icon: "fas fa-fw fa-file-alt"
      url: "https://lattes.cnpq.br/3364432948507529"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/savi8sant8s"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/savi8sant8s"

